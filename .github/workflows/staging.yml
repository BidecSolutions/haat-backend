name: Docker Deploy (Laravel Backend) — Staging

on:
  pull_request:
    types: [closed]
    branches:
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: read

    env:
      APP_DIR: /opt/apps/haat/staging/backend
      SSH_PORT_DEFAULT: "22"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            const lines = commits.map(c => {
              const author = c.author ? c.author.login : (c.commit.author?.name || 'Unknown');
              return `  • ${c.sha.substring(0, 7)} (${author}) ${c.commit.message.split('\n')[0]}`;
            });
            core.setOutput('commits', lines.join('\n'));
            core.setOutput('pr_title', pr.title);
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('merged_by', pr.merged_by?.login || 'unknown');

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Resolve SSH port
        run: |
          if [ -n "${{ secrets.DEPLOY_PORT }}" ]; then
            echo "SSH_PORT=${{ secrets.DEPLOY_PORT }}" >> $GITHUB_ENV
          else
            echo "SSH_PORT=${{ env.SSH_PORT_DEFAULT }}" >> $GITHUB_ENV
          fi

      - name: Ensure server directory exists
        run: |
          ssh -i /tmp/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no \
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
          "mkdir -p '${{ env.APP_DIR }}'"

      - name: Upload project to server (rsync)
        run: |
          RSYNC_SSH="ssh -i /tmp/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no"
          rsync -rz --delete \
            --checksum \
            --no-perms --no-owner --no-group \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "storage" \
            --exclude "bootstrap/cache" \
            -e "$RSYNC_SSH" \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.APP_DIR }}

      - name: Deploy on server (docker compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e
            cd "${{ env.APP_DIR }}"

            test -f artisan       || (echo "ERROR: artisan missing" && exit 1)
            test -f composer.json || (echo "ERROR: composer.json missing" && exit 1)
            test -f compose.prod.yaml || (echo "ERROR: compose.prod.yaml missing" && exit 1)

            if [ ! -f .env ]; then
              [ -f .env.example ] && cp .env.example .env || (echo "ERROR: .env not found" && exit 1)
            fi

            DOCKER_BUILDKIT=1 docker compose -f compose.prod.yaml up -d --build
            docker image prune -f

      - name: Verify container health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          timeout: 60s
          command_timeout: 2m
          script: |
            echo "Waiting for container to become healthy..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' haat-staging-php-fpm-1 2>/dev/null || echo "missing")
              echo "  [$i/18] $STATUS"
              [ "$STATUS" = "healthy" ] && echo "Container is healthy" && exit 0
              sleep 5
            done
            echo "ERROR: Container not healthy after 90s — last logs:"
            docker logs haat-staging-php-fpm-1 --tail=30 2>&1
            exit 1

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.bidecsol.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ HAAT Backend · Staging — Deployed"
          body: |
            ✅  Deployment to STAGING succeeded

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
             App         HAAT Backend
             Environment Staging
             URL         https://dev-api.spacesaverzone.com
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
             PR #${{ steps.pr-info.outputs.pr_number }}    ${{ steps.pr-info.outputs.pr_title }}
             Merged by   ${{ steps.pr-info.outputs.merged_by }}
             Commit      ${{ github.sha }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            Changes:
            ${{ steps.pr-info.outputs.commits }}

            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: enganaskhalid@gmail.com, syedhasssan93@gmail.com
          from: "HAAT Backend — Staging <${{ secrets.EMAIL_USERNAME }}>"

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.bidecsol.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ HAAT Backend · Staging — Failed"
          body: |
            ❌  Deployment to STAGING failed

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
             App         HAAT Backend
             Environment Staging
             URL         https://dev-api.spacesaverzone.com
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
             PR #${{ steps.pr-info.outputs.pr_number }}    ${{ steps.pr-info.outputs.pr_title }}
             Merged by   ${{ steps.pr-info.outputs.merged_by }}
             Commit      ${{ github.sha }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            Changes:
            ${{ steps.pr-info.outputs.commits }}

            🔗 View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: enganaskhalid@gmail.com, syedhasssan93@gmail.com
          from: "HAAT Backend — Staging <${{ secrets.EMAIL_USERNAME }}>"
